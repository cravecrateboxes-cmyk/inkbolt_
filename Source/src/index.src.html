</head>
<body>
<div id="boot" class="boot"><div class="boot-plate"><span class="boot-word">INKBOLT</span><div class="boot-bar"><i id="bootBar"></i></div></div></div>
<canvas id="c" aria-label="Game view"></canvas>
<div id="touchLayer"></div>
<div id="flash" class="flash"></div>
<div id="dim" class="waydim" aria-hidden="true"><i class="dim-tone"></i><i class="dim-vig"></i><i class="dim-dots"></i></div>
<div id="hurt" class="hurt" aria-hidden="true"><i class="hurt-low"></i><i class="hurt-flash" id="hurtFlash"></i></div>
<div id="hud" class="hud" hidden>
  <div class="hud-top">
    <div class="sc" id="score">
      <span class="score-zone" id="scZone">ZONE 1/2</span>
      <span class="score-left" id="scLeft">0 LEFT</span>
    </div>
    <div class="pips" id="pips"></div>
  </div>
  <div class="hud-tl">
    <div class="gm" id="gems"><svg class="ic gem-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l7 8-7 10L3 9z"/></svg><b class="nu" id="gemCount">0</b></div>
  </div>
  <div class="hud-tr">
    <div class="rdr" id="radar" hidden><canvas id="radarCv" width="200" height="200"></canvas></div>
    <div class="feed" id="feed"></div>
    <div class="ticker" id="ticker"></div>
  </div>
  <div class="xhair" id="xhair"><svg class="xbr" viewBox="-50 -50 100 100" aria-hidden="true"><path d="M-30 -30A42 42 0 0 0 -30 30"/><path d="M30 -30A42 42 0 0 1 30 30"/></svg><i></i><i></i><i></i><i></i><b class="xdot"></b></div>
  <svg class="hitmark" id="hitmark" viewBox="-20 -20 40 40" aria-hidden="true"><path class="hm-ink" d="M-9-9l-7-7M9-9l7-7M-9 9l-7 7M9 9l7 7"/><path class="hm" d="M-9-9l-7-7M9-9l7-7M-9 9l-7 7M9 9l7 7"/></svg>
  <svg class="arcs" id="arcs" viewBox="-150 -150 300 300" aria-hidden="true"></svg>
  <div class="callouts" id="callouts">
    <div class="use-prompt" id="usePrompt" hidden><span class="key">E</span><span class="ut"></span><span class="us"></span><i class="uacc" aria-hidden="true"></i></div>
    <div class="prompt" id="prompt" hidden><span class="key" id="promptKey">R</span><span id="promptText">Reload</span><i class="prompt-bar"><i id="promptFill"></i></i><i class="prompt-ring" aria-hidden="true"></i></div>
    <div class="call-rows" id="callRows"></div>
  </div>
  <div class="hud-bl">
    <div class="lvhex" id="lvHex"><b><span><small>LV</small><i id="lvNum">1</i></span></b></div>
    <div class="vt">
      <div class="row vh mo"><span>Scrapper</span></div>
      <div class="vr hp" id="health">
        <span class="vi"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 1h6v6h6v6h-6v6H7v-6H1V7h6z"/></svg></span>
        <div class="vb hp-bar"><i class="hp-chip" id="hpChip"></i><i id="hpFill"></i><i class="hp-ticks"></i><b class="nu" id="hpNum">100</b><em class="mo">HP</em></div>
      </div>
      <div class="xprow" id="lvTag"><span class="mo">XP</span><div class="xp-bar"><i class="xp-gain" id="xpGain"></i><i id="xpFill"></i></div><b class="xp-num mo" id="xpNum">0%</b><span class="lv-pts" id="lvPts" hidden><b id="lvPtsN">+1</b><span class="lv-key" id="lvKey">Tab</span></span><span class="xp-plus" id="xpPlus" aria-hidden="true"></span></div>
      <div class="stamina" id="stamina"><i id="stFill"></i></div>
    </div>
    <div class="abl" id="abl">
      <div class="kit" id="kit" hidden><span class="kit-chip" id="kitMelee" hidden><span class="kit-ic" id="kitMeleeIc"></span><span class="kit-nm" id="kitMeleeName"></span><b class="key">V</b></span><span class="kit-chip" id="kitGren" hidden><span class="kit-ic" id="kitGrenIc"></span><span class="kit-n nu" id="kitGrenN">3</span><b class="key">G</b></span></div>
    </div>
  </div>
  <div class="hud-br">
    <div class="whl"><div class="slots" id="slots"></div></div>
    <div class="wp" id="weapon">
      <b class="wpn-name d" id="wpnName">P-12 WARDEN</b>
      <div class="brush"></div>
      <span class="wpn-cls mo"><span class="wpn-icon" id="wpnIcon"></span><span id="wpnCls">Pistol</span></span>
      <div class="amb" id="ammo"><b class="d" id="ammoMag">12</b><span class="r d" id="ammoRes">/ &infin;</span></div>
      <div class="mag-strip" id="magStrip"><i id="magFill"></i></div>
    </div>
  </div>
  <div class="pickup" id="pickup" hidden>
    <div class="g nt pickup-card"><span class="blk pickup-icon" id="pickupIcon"></span><span class="nt-tx"><span class="a mo" id="pickupHdL">New weapon</span><b class="b d" id="pickupName">AR-22 RIVET</b><span class="c" id="pickupLine">Press 3 to equip</span></span></div>
  </div>
  <div class="notice" id="notice" hidden>
    <div class="g nt red"><span class="blk nu">!</span><span class="nt-tx"><span class="a mo">Notice</span><b class="b d" id="noteT"></b><span class="c" id="noteS"></span></span></div>
  </div>
  <div class="banner" id="toast" hidden><span class="ban-t d" id="toastT"></span><span class="ban-s" id="toastS"></span></div>
  <div class="elim" id="elim" hidden>
    <div class="elim-card">
      <span class="elim-by d">Eliminated by</span>
      <b class="elim-name d" id="elimName">CRAWLER</b>
      <span class="elim-row"><span id="elimCount">Back in 3</span><span id="elimRetries">Retries left 2</span></span>
    </div>
  </div>
  <button class="plate ink pausebtn menubtn" id="menuBtn" aria-label="Inventory, skills and character"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z" fill="currentColor"/></svg><i class="menubtn-dot" id="menuDot" hidden></i></button>
  <button class="plate ink pausebtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/></svg></button>
</div>
<div id="touch" class="touch" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<div id="tabmenu" class="tabmenu" hidden></div>
<div id="loading" class="ldr" hidden></div>
